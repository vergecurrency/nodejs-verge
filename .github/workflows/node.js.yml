# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm test

  verged-integration:
    name: Verge Core v26.7 integration
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERGE_ARCHIVE_SHA256: f1476ac7e5a5d5ccfac1d2c79104c4cf4cf62de979e45448c33d180dfee34799

    steps:
    - uses: actions/checkout@v4
    - name: Configure temporary paths
      run: |
        echo "VERGE_ARCHIVE=$RUNNER_TEMP/verge-ubuntu24-appimages-v26.7.zip" >> "$GITHUB_ENV"
        echo "VERGE_BIN_DIR=$RUNNER_TEMP/verge-v26.7" >> "$GITHUB_ENV"
        echo "VERGE_DATA_DIR=$RUNNER_TEMP/verged-data" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
    - run: npm ci
    - name: Cache Verge Core v26.7
      id: cache-verge
      uses: actions/cache@v4
      with:
        path: ${{ env.VERGE_ARCHIVE }}
        key: verge-core-v26.7-ubuntu24-${{ env.VERGE_ARCHIVE_SHA256 }}
    - name: Download Verge Core v26.7
      if: steps.cache-verge.outputs.cache-hit != 'true'
      run: |
        curl --fail --location --retry 3 \
          --output "$VERGE_ARCHIVE" \
          https://github.com/vergecurrency/verge/releases/download/v26.7/verge-ubuntu24-appimages.zip
    - name: Verify and extract Verge Core
      run: |
        echo "$VERGE_ARCHIVE_SHA256  $VERGE_ARCHIVE" | sha256sum --check --strict
        mkdir -p "$VERGE_BIN_DIR"
        unzip -q "$VERGE_ARCHIVE" -d "$VERGE_BIN_DIR"
        chmod +x "$VERGE_BIN_DIR"/*.AppImage
    - name: Start verged in regtest with default RPC settings
      run: |
        mkdir -p "$VERGE_DATA_DIR"
        APPIMAGE_EXTRACT_AND_RUN=1 "$VERGE_BIN_DIR/verged-x86_64.AppImage" \
          -datadir="$VERGE_DATA_DIR" \
          -regtest \
          -daemon \
          -server \
          -connect=0 \
          -dnsseed=0 \
          -discover=0 \
          -listen=0
        for attempt in {1..60}; do
          if APPIMAGE_EXTRACT_AND_RUN=1 "$VERGE_BIN_DIR/verge-cli-x86_64.AppImage" \
            -datadir="$VERGE_DATA_DIR" -regtest getblockchaininfo >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "verged RPC did not become ready" >&2
        tail -n 200 "$VERGE_DATA_DIR/regtest/debug.log" || true
        exit 1
    - name: Test against verged
      env:
        VERGED_INTEGRATION: 1
        VERGED_COOKIE_FILE: ${{ env.VERGE_DATA_DIR }}/regtest/.cookie
        VERGED_RPC_PORT: 18334
      run: npm test
    - name: Show daemon log on failure
      if: failure()
      run: tail -n 200 "$VERGE_DATA_DIR/regtest/debug.log" || true
    - name: Stop verged
      if: always()
      run: |
        APPIMAGE_EXTRACT_AND_RUN=1 "$VERGE_BIN_DIR/verge-cli-x86_64.AppImage" \
          -datadir="$VERGE_DATA_DIR" -regtest stop || true
